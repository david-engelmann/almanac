[workspace]
resolver = "2"
members = [
    "crates/almanac-core",
    "crates/almanac-cli",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
almanac-core = { path = "crates/almanac-core", version = "0.1.0" }

[profile.release]
debug = false
