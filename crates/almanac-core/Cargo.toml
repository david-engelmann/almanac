[package]
name = "almanac-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Core library for almanac, the drift gate for agent discovery catalogs. Catalog model, generation rules, baseline format and drift logic, free of network and filesystem code."
repository = "https://github.com/david-engelmann/almanac"
readme = "../../README.md"
keywords = ["ard", "agent-discovery", "mcp", "drift", "ci"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.10"
# ES256 verification for trust manifest signatures.
# ring is already in the tree through rustls; naming
# it here adds no new dependency family.
ring = "0.17"
